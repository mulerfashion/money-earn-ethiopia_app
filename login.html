<!DOCTYPE html>
<html lang="en">

<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Login - Money Earn Ethiopia</title>

  <link rel="stylesheet" href="css/style.css">
</head>

<body>

<header>
  <h1>Money Earn Ethiopia</h1>
</header>

<div class="hero">

  <h2>Login</h2>

  <input
    type="email"
    id="email"
    placeholder="Email"
  >

  <br><br>

  <input
    type="password"
    id="password"
    placeholder="Password"
  >

  <br><br>

  <button id="loginBtn">
    Login
  </button>

  <br><br>

  <p>Don't have an account?</p>

  <a href="register.html">
    <button type="button">
      Create Account
    </button>
  </a>

</div>

<script
  type="module"
  src="js/login.js">
</script>

</body>
</html>

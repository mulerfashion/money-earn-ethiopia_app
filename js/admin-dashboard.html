<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Admin Dashboard - Money Earn Ethiopia</title>

<link
    rel="stylesheet"
    href="css/style.css"
>

<style>

body{
    margin:0;
    background:#f5f5f5;
    font-family:Arial,sans-serif;
}

/* =========================
   HEADER
========================= */

header{
    background:#087dcc;
    color:white;
    text-align:center;
    padding:22px 10px;
}

header h1{
    margin:0;
    font-size:28px;
}

/* =========================
   MAIN
========================= */

.hero{
    width:95%;
    max-width:900px;
    margin:25px auto;
}

/* =========================
   CARDS
========================= */

.card{
    background:white;
    border-radius:15px;
    padding:20px;
    margin-bottom:20px;
    box-shadow:0 3px 10px rgba(0,0,0,0.10);
}

.card h2{
    text-align:center;
    margin-top:0;
    margin-bottom:20px;
}

/* =========================
   STATISTICS
========================= */

.stats{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:12px;
}

.stat{
    background:#f8f8f8;
    border-radius:10px;
    padding:15px;
    text-align:center;
    border:1px solid #eee;
}

.stat-title{
    font-size:15px;
    margin-bottom:8px;
}

.stat-value{
    font-size:22px;
    font-weight:bold;
}

/* =========================
   ADMIN MENU
========================= */

.admin-menu{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:12px;
}

.admin-menu a{
    text-decoration:none;
}

.admin-menu button,
.logout-button{
    width:100%;
    padding:15px 10px;
    border:none;
    border-radius:10px;
    background:#08a66a;
    color:white;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

.admin-menu button:hover,
.logout-button:hover{
    opacity:.9;
}

.logout-area{
    margin-top:15px;
}

.logout-button{
    background:#d62828;
}

/* =========================
   MOBILE
========================= */

@media(max-width:600px){

    header h1{
        font-size:24px;
    }

    .hero{
        width:92%;
    }

    .stats{
        grid-template-columns:1fr 1fr;
    }

    .admin-menu{
        grid-template-columns:1fr 1fr;
    }

    .admin-menu button,
    .logout-button{
        font-size:14px;
        padding:14px 5px;
    }

}

</style>

</head>


<body>


<header>

<h1>
👑 Admin Dashboard
</h1>

<p>
💰 Money Earn Ethiopia
</p>

</header>


<main class="hero">


<!-- =========================
     STATISTICS
========================= -->

<div class="card">

<h2>
📊 Statistics
</h2>


<div class="stats">


<div class="stat">

<div class="stat-title">
👥 Total Users
</div>

<div
    class="stat-value"
    id="totalUsers"
>
0
</div>

</div>


<div class="stat">

<div class="stat-title">
💳 Total Deposits
</div>

<div
    class="stat-value"
    id="totalDeposits"
>
0
</div>

</div>


<div class="stat">

<div class="stat-title">
⏳ Pending Deposits
</div>

<div
    class="stat-value"
    id="pendingDeposits"
>
0
</div>

</div>


<div class="stat">

<div class="stat-title">
💸 Total Withdrawals
</div>

<div
    class="stat-value"
    id="totalWithdrawals"
>
0
</div>

</div>


<div class="stat">

<div class="stat-title">
⏳ Pending Withdrawals
</div>

<div
    class="stat-value"
    id="pendingWithdrawals"
>
0
</div>

</div>


<div class="stat">

<div class="stat-title">
📋 Total Tasks
</div>

<div
    class="stat-value"
    id="totalTasks"
>
0
</div>

</div>


<div class="stat">

<div class="stat-title">
💰 Total Balance
</div>

<div
    class="stat-value"
    id="totalBalance"
>
0 ETB
</div>

</div>


</div>

</div>


<!-- =========================
     ADMIN MENU
========================= -->

<div class="card">

<h2>
⚙️ Admin Menu
</h2>


<div class="admin-menu">


<a href="admin-users.html">

<button type="button">
👥 Manage Users
</button>

</a>


<a href="admin-task.html">

<button type="button">
📋 Manage Tasks
</button>

</a>


<a href="admin-deposits.html">

<button type="button">
💳 Manage Deposits
</button>

</a>


<a href="admin-withdrawals.html">

<button type="button">
💸 Manage Withdrawals
</button>

</a>


</div>


<div class="logout-area">

<button
    type="button"
    id="logoutBtn"
    class="logout-button"
>
🚪 Logout
</button>

</div>


</div>


</main>


<script
    type="module"
    src="js/admin-dashboard.js"
></script>


</body>

</html>

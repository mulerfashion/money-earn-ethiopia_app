<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Admin Withdrawals</title>

<link
    rel="stylesheet"
    href="css/style.css"
>

<style>

body{
    background:#f5f5f5;
    font-family:Arial,sans-serif;
    margin:0;
}

header{
    background:#0a7d2c;
    color:white;
    padding:15px;
    text-align:center;
}

.container{
    width:95%;
    max-width:900px;
    margin:20px auto;
}

.top{
    display:flex;
    gap:10px;
    margin-bottom:20px;
}

.top input{
    flex:1;
    padding:10px;
    border:1px solid #ccc;
    border-radius:5px;
}

.top select{
    padding:10px;
    border:1px solid #ccc;
    border-radius:5px;
}

.card{
    background:white;
    padding:15px;
    margin-bottom:15px;
    border-radius:10px;
    box-shadow:0 2px 5px rgba(0,0,0,.1);
}

.card h3{
    margin:0 0 10px 0;
}

.card p{
    margin:5px 0;
}

.buttons{
    display:flex;
    gap:10px;
    margin-top:15px;
}

.buttons button{
    display:inline-block !important;
    visibility:visible !important;
    opacity:1 !important;
    padding:10px 15px;
    border:none;
    cursor:pointer;
    border-radius:5px;
    font-size:15px;
    font-weight:bold;
}

.approve{
    background:green;
    color:white;
}

.reject{
    background:red;
    color:white;
}

.approve:hover{
    opacity:.85 !important;
}

.reject:hover{
    opacity:.85 !important;
}

@media(max-width:600px){

    .top{
        flex-direction:column;
    }

    .buttons{
        flex-direction:column;
    }

    .buttons button{
        width:100%;
    }

}

</style>

</head>


<body>

<header>

<h2>Admin Withdrawals</h2>

</header>


<div class="container">


<div class="top">

<input
    type="text"
    id="searchInput"
    placeholder="Search user..."
>

<select id="statusFilter">

    <option value="pending">
        Pending
    </option>

    <option value="approved">
        Approved
    </option>

    <option value="rejected">
        Rejected
    </option>

</select>

</div>


<div id="withdrawalsList">

    <p>⏳ Loading withdrawals...</p>

</div>


</div>


<script
    type="module"
    src="js/admin-withdrawals.js"
></script>


</body>

</html>

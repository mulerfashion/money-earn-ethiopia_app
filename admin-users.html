<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Users</title>

<link rel="stylesheet" href="css/style.css">

<style>

body{
    font-family:Arial,sans-serif;
    background:#f5f5f5;
}

header{
    background:#0a7d2c;
    color:#fff;
    padding:15px;
    text-align:center;
}

.container{
    width:95%;
    max-width:1000px;
    margin:20px auto;
}

#searchInput{
    width:100%;
    padding:10px;
    margin-bottom:20px;
}

.card{
    background:#fff;
    padding:15px;
    border-radius:10px;
    margin-bottom:15px;
    box-shadow:0 2px 5px rgba(0,0,0,.1);
}

.delete{
    background:red;
    color:#fff;
    border:none;
    padding:10px 15px;
    border-radius:5px;
    cursor:pointer;
}

</style>

</head>

<body>

<header>
<h2>Admin Users</h2>
</header>

<div class="container">

<input
type="text"
id="searchInput"
placeholder="Search by name or email">

<div id="usersList"></div>

</div>

<script type="module" src="js/admin-users.js"></script>

</body>
</html>

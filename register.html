<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Create Account - Money Earn Ethiopia</title>

  <link rel="stylesheet" href="css/style.css">
</head>

<body>

  <header>
    <h1>💰 Money Earn Ethiopia</h1>
    <p>Create your account</p>
  </header>

  <main>

    <div class="card">

      <h2>Create Account</h2>

      <input
        type="text"
        id="name"
        placeholder="Full Name"
      >

      <input
        type="email"
        id="email"
        placeholder="Email"
      >

      <input
        type="password"
        id="password"
        placeholder="Password"
      >

      <input
        type="text"
        id="referralCode"
        placeholder="Referral Code (optional)"
      >

      <button
        type="button"
        id="registerBtn">
        Create Account
      </button>

      <p>
        Already have an account?
        <a href="login.html">Login</a>
      </p>

    </div>

  </main>

  <script type="module" src="./js/register.js"></script>

</body>
</html>

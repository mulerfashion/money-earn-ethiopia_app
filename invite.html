<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Invite Friends - Money Earn Ethiopia</title>

  <link rel="stylesheet" href="css/style.css">

</head>

<body>


<header>

  <h1>👥 Invite Friends</h1>

</header>



<div class="hero">


  <div class="card">


    <h2>Invite Friends & Earn</h2>


    <p>
      Your Referral Link
    </p>


    <input
      type="text"
      id="refLink"
      readonly
      placeholder="Loading referral link..."
    >


    <br><br>


    <button
      type="button"
      id="copyBtn"
    >
      📋 Copy Link
    </button>


    <br><br>


    <button
      type="button"
      id="shareBtn"
    >
      📤 Share Link
    </button>


    <br><br>


    <p id="message"></p>



    <!-- ================================ -->
    <!-- REFERRAL COUNT -->
    <!-- ================================ -->

    <h3>
      👥 Your Referrals
    </h3>


    <p id="referralCount">
      0 Friends
    </p>



    <!-- ================================ -->
    <!-- REFERRAL FRIEND LIST -->
    <!-- ================================ -->

    <div class="card">

      <h3>
        👥 Friends List
      </h3>


      <div id="referralList">

        <p>
          ⏳ Loading friends...
        </p>

      </div>

    </div>



    <br>


    <!-- ================================ -->
    <!-- REFERRAL EARNINGS -->
    <!-- ================================ -->

    <h3>
      💰 Referral Earnings
    </h3>


    <p id="referralEarn">
      0.00 ETB
    </p>


    <p>
      Earn <strong>20 ETB</strong>
      for every successful referral.
    </p>


  </div>


  <br>


  <a href="dashboard.html">

    <button type="button">
      ⬅ Back Dashboard
    </button>

  </a>


</div>



<!-- ================================ -->
<!-- BOTTOM NAVIGATION -->
<!-- ================================ -->

<div class="bottom-nav">


  <a href="dashboard.html">
    🏠 Home
  </a>


  <a href="tasks.html">
    📋 Tasks
  </a>


  <a href="wallet.html">
    👛 Wallet
  </a>


  <a href="profile.html">
    👤 Profile
  </a>


</div>



<script
  type="module"
  src="js/invite.js">
</script>


</body>

</html>
